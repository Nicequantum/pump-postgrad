# Audit and self-heal pack (Harris blanket approval, voice, Oct 29 2026 4:12 PM ET).
# Plan: ingest-full-standard-plan-20261029.md. Sign-only by default: nothing posts unless repo vars
# Nicequantum repo: artifact-only record (90 days); no hub emitter in this repo.
name: audit-events
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, closed, edited, review_requested, labeled]
  pull_request_review:
    types: [submitted, dismissed, edited]
  push:
    branches: ['**']
    tags: ['**']
  release:
    types: [published, edited, deleted]
  create:
  delete:
permissions:
  contents: read
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Build schemaVersion 2 audit event
        run: bash .github/scripts/audit-event.sh
      - name: Upload signed-later audit record (retained 90 days)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: audit-event-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: audit-out/
          retention-days: 90
