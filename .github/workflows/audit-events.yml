# Audit event recorder: artifact-only record (14 days). No hub emitter and no network calls in this repo.
# PR title and body are recorded only as length. No concurrency block: every event is recorded.
name: audit-events
on:
  pull_request:
    # PR pushes (including from forks) are recorded here as pr.pushed; read-only contents, no secrets.
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, closed, edited, review_requested, labeled]
  pull_request_review:
    types: [submitted, dismissed, edited]
  push:
    # Default branch only, so PR pushes are not recorded twice. Tags are recorded by create.
    branches: [main]
  release:
    types: [published, edited, deleted]
  create:
  delete:
permissions:
  contents: read
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Build schemaVersion 2 audit event
        run: bash .github/scripts/audit-event.sh
      - name: Upload audit record (retained 14 days)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: audit-event-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: audit-out/
          retention-days: 14
