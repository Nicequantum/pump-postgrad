[package]
name = "solana-stream-sdk"
version = "0.1.0"
edition = "2021"
description = "RPC Fast / custom Shredstream gRPC client for raw Solana Entry streaming"
license = "MIT"

[dependencies]
tonic = { version = "0.12", features = ["tls", "tls-roots"] }
prost = "0.13"
tokio = { version = "1.44", features = ["full"] }
solana-entry = "2.2"
solana-sdk = "2.2"
bincode = "1.3"
anyhow = "1.0"
tracing = "0.1"

[build-dependencies]
tonic-build = "0.12"